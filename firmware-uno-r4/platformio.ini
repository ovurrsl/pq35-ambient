; PQ35-AMBIENT — Listen-Only CAN logger · Arduino UNO R4
;
; `firmware/` (ESP32-S3) ile aynı çıktıyı üretir; `tools/can-analiz.py` ikisini de okur.
;
; İKİ ORTAM, İKİ HAT. Bit zamanlaması derleme zamanında sabitlenir; çalışma anında baud
; değiştirmek gereksiz karmaşıklık olurdu ve yanlış hatta yanlış hızla bağlanma riskini
; artırırdı.
;
;   pio run -e wifi-komfort    -t upload -t monitor    ← v1, 100 kbps, önce bu
;   pio run -e wifi-antriebs   -t upload -t monitor    ← 2. faz, 500 kbps
;
; Minima ortamları da var çünkü CAN pinleri iki kartta FARKLI (WiFi: D10/D13,
; Minima: D4/D5) ve bunu yanlış bilmek "kart bozuk" sanmaya yol açıyor.

[env]
platform = renesas-ra
framework = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter
build_flags =
    -Wall
    -Wextra

[wifi]
board = uno_r4_wifi

[minima]
board = uno_r4_minima

[env:wifi-komfort]
extends = wifi
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"komfort"'
    -DHAT_BITRATE=100000

[env:wifi-antriebs]
extends = wifi
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"antriebs"'
    -DHAT_BITRATE=500000

[env:minima-komfort]
extends = minima
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"komfort"'
    -DHAT_BITRATE=100000

[env:minima-antriebs]
extends = minima
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"antriebs"'
    -DHAT_BITRATE=500000
