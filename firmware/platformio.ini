; PQ35-AMBIENT — Listen-Only CAN logger
;
; İKİ ORTAM, İKİ HAT. Bit zamanlaması derleme zamanında sabitlenir; çalışma anında
; baud değiştirmek gereksiz karmaşıklık olurdu ve yanlış hatta yanlış hızla bağlanma
; riskini artırırdı.
;
;   pio run -e komfort   -t upload -t monitor    ← v1, 100 kbps, önce bu
;   pio run -e antriebs  -t upload -t monitor    ← 2. faz, 500 kbps
;
; Nano ESP32 yerel USB CDC kullanır; monitor_speed CDC'de anlamsızdır ama
; PlatformIO'nun terminali için zararsız duruyor.

[env]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

[env:komfort]
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"komfort"'
    -DHAT_BITRATE=100000

[env:antriebs]
build_flags =
    ${env.build_flags}
    -DHAT_ADI='"antriebs"'
    -DHAT_BITRATE=500000
